[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simple-agent-tui"
version = "0.1.0"
description = "A small terminal AI agent with Agent Skills and MCP support"
requires-python = ">=3.11"
dependencies = [
  "httpcore>=1,<2",
  "httpx>=0.27,<1",
  "lxml>=5,<7",
  "mcp>=1.24,<2",
  "openai>=1.70,<3",
  "PyYAML>=6,<7",
  "textual>=1,<7",
  "trafilatura>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.25"]

[project.scripts]
simple-agent = "simple_agent.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/simple_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
